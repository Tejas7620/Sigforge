[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigforge"
version = "0.1.0"
description = "Automated Blind Signal Analysis & Decoding Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SigForge Team", email = "sigforge@example.com"},
]
keywords = ["signal-processing", "SDR", "DSP", "modulation", "FEC", "blind-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "soundfile>=0.12",
    "reedsolo>=1.7",
    "Jinja2>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "black>=23.0",
    "ruff>=0.1",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
sigforge = "sigforge.__main__:main"

[project.gui-scripts]
sigforge-gui = "sigforge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigforge*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
